<div class="layout" [class.sidebar-collapsed]="!sidebarOpen">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <span class="logo-hex">⬡</span>
        <span class="logo-text" *ngIf="sidebarOpen">NexusDash</span>
      </div>
      <button class="collapse-btn" (click)="sidebarOpen = !sidebarOpen" [matTooltip]="sidebarOpen ? 'Collapse' : 'Expand'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline *ngIf="sidebarOpen"  points="15 18 9 12 15 6"></polyline>
          <polyline *ngIf="!sidebarOpen" points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <!-- User Card -->
    <div class="user-card" *ngIf="currentUser">
      <div class="avatar-wrap">
        <img [src]="currentUser.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + currentUser.username"
             [alt]="currentUser.username" class="avatar" />
        <span class="status-dot"></span>
      </div>
      <div class="user-info" *ngIf="sidebarOpen">
        <span class="user-name">{{ currentUser.username }}</span>
        <span class="user-role" [class.admin]="currentUser.role === 'Admin'">
          {{ currentUser.role }}
        </span>
      </div>
    </div>

    <!-- Nav -->
    <nav class="nav">
      <a
        *ngFor="let item of visibleNavItems"
        [routerLink]="item.route"
        class="nav-item"
        [class.active]="currentRoute.startsWith(item.route)"
        [matTooltip]="!sidebarOpen ? item.label : ''"
        matTooltipPosition="right">
        <span class="nav-icon">
          <svg *ngIf="item.icon === 'grid'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          <svg *ngIf="item.icon === 'users'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <span class="nav-label" *ngIf="sidebarOpen">{{ item.label }}</span>
        <span class="nav-badge admin-badge" *ngIf="item.adminOnly && sidebarOpen">Admin</span>
      </a>
    </nav>

    <!-- Bottom -->
    <div class="sidebar-bottom">
      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [matTooltip]="!sidebarOpen ? 'Toggle theme' : ''"
        matTooltipPosition="right"
        [attr.aria-label]="themeService.currentTheme === 'light' ? 'Switch to dark theme' : 'Switch to light theme'">
        <svg *ngIf="themeService.currentTheme === 'light'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg *ngIf="themeService.currentTheme === 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span *ngIf="sidebarOpen">{{ themeService.currentTheme === 'light' ? 'Dark Theme' : 'Light Theme' }}</span>
      </button>
      <button class="logout-btn" (click)="logout()" [matTooltip]="!sidebarOpen ? 'Logout' : ''" matTooltipPosition="right">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span *ngIf="sidebarOpen">Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
